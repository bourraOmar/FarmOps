name: Mobile App CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'mobile-app/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'mobile-app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile-app

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        
    - name: Install dependencies
      run: npm ci || npm install
      
    - name: Setup Expo
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        token: ${{ secrets.EXPO_TOKEN }} # Optional, primarily required for EAS updates
        
    # Example check, e.g. typecheck. Can be adjusted based on mobile-app scripts.
    - name: Type Check
      run: npx tsc --noEmit
