name: Web Admin CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'web-admin/**'
      - '.github/workflows/ci-web-admin.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'web-admin/**'
      - '.github/workflows/ci-web-admin.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-admin

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        
    - name: Install dependencies
      run: npm ci || npm install
      
    - name: Run Linter
      run: npm run lint
      
    - name: Build Next.js
      run: npm run build
